name: Build and Release AstraConv

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mido tkinterdnd2 requests
          pip install basic-pitch[onnx] onnxruntime
          pip install pyinstaller

      - name: Verify import chain works
        run: |
          python -c "import basic_pitch.inference; import numba; import resampy; import mir_eval; print('all imports OK')"

      - name: Trim unused ONNX/TF models
        shell: pwsh
        run: |
          $py_path = python -c "import basic_pitch, os; print(os.path.dirname(basic_pitch.__file__))"
          $model_dir = Join-Path $py_path "saved_models\icassp_2022"
          if (Test-Path "$model_dir\nmp")        { Remove-Item -Recurse -Force "$model_dir\nmp" }
          if (Test-Path "$model_dir\nmp.tflite") { Remove-Item -Force "$model_dir\nmp.tflite" }
          Write-Host "ONNX model kept:"
          Get-ChildItem $model_dir

      - name: Verify main file
        shell: pwsh
        run: |
          if (!(Test-Path "AstraConv.py")) {
            Write-Error "AstraConv.py не найден в корне"
            exit 1
          }

      - name: Download UPX
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip" -OutFile upx.zip
          Expand-Archive upx.zip -DestinationPath .
          $upx = Get-ChildItem -Path . -Filter upx.exe -Recurse | Select-Object -First 1
          echo "UPX_DIR=$($upx.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build EXE
        shell: pwsh
        run: |
          $iconArg = @()
          if (Test-Path "assets/icon.ico") { $iconArg = @("--icon=assets/icon.ico") }

          pyinstaller `
            --noconfirm --clean --onefile --noconsole `
            --name AstraConv `
            --upx-dir=$env:UPX_DIR `
            --upx-exclude=python3.dll `
            --upx-exclude=vcruntime140.dll `
            --upx-exclude=vcruntime140_1.dll `
            @iconArg `
            --collect-all basic_pitch `
            --collect-all librosa `
            --collect-all soundfile `
            --collect-all resampy `
            --collect-all numba `
            --collect-all llvmlite `
            --collect-all pretty_midi `
            --collect-all mir_eval `
            --collect-submodules scipy `
            --hidden-import tkinterdnd2 `
            --hidden-import mido `
            --hidden-import onnxruntime `
            --hidden-import numpy `
            --hidden-import numpy.testing `
            --hidden-import scipy `
            --hidden-import scipy.sparse `
            --hidden-import scipy.sparse.linalg `
            --hidden-import scipy.sparse.csgraph `
            --hidden-import scipy.stats `
            --hidden-import numba `
            --hidden-import llvmlite `
            --hidden-import resampy `
            --hidden-import mir_eval `
            --hidden-import requests `
            --hidden-import unittest `
            --hidden-import pkg_resources `
            --hidden-import setuptools `
            --exclude-module tensorflow `
            --exclude-module tensorboard `
            --exclude-module keras `
            --exclude-module torch `
            --exclude-module torchaudio `
            --exclude-module torchvision `
            --exclude-module matplotlib `
            --exclude-module IPython `
            --exclude-module jupyter `
            --exclude-module notebook `
            --exclude-module pandas `
            --exclude-module pytest `
            --exclude-module sphinx `
            --exclude-module PyQt5 `
            --exclude-module PyQt6 `
            --exclude-module PySide2 `
            --exclude-module PySide6 `
            AstraConv.py

      - name: Report size
        shell: pwsh
        run: |
          $f = Get-Item "dist/AstraConv.exe"
          $mb = [math]::Round($f.Length / 1MB, 1)
          Write-Host "Итоговый размер: $mb МБ"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstraConv-windows
          path: dist/AstraConv.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AstraConv ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/AstraConv.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
